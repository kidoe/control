name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.compiler }}, ${{ matrix.voices }} voices
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        # Polyphony is a compile-time constant, so each build is a different
        # program and each one has to be tested.
        voices: [4, 8, 32]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S libsynth -B build
          -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=Release
          -DSYNTH_MAX_VOICES=${{ matrix.voices }}
          -DCMAKE_C_FLAGS=-Werror

      - name: Build
        run: cmake --build build

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  portability:
    name: portability guarantees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the core alone
        # -fno-stack-protector keeps the check about what the source calls
        # rather than what the distribution's default flags inject.
        run: >
          cmake -S libsynth -B build
          -DCMAKE_BUILD_TYPE=Release
          -DSYNTH_BUILD_TESTS=OFF
          -DSYNTH_BUILD_EXAMPLES=OFF
          -DCMAKE_C_FLAGS=-fno-stack-protector
          && cmake --build build

      - name: The tests must be clean under memcheck
        # Catches what the assertions cannot: a read of memory nobody wrote,
        # which a later write can paper over so that every test still passes.
        # Exactly that slipped in once, in synth_init, and this is how it was
        # found.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends valgrind
          cmake -S libsynth -B build-vg -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-vg
          valgrind -q --error-exitcode=1 --track-origins=yes build-vg/test_synth

      - name: The core must link against nothing
        run: sh libsynth/tools/check-no-external-deps.sh build/libsynth.a

      - name: The Android bridge must mirror the parameter enum
        run: sh libsynth/tools/check-java-constants.sh libsynth

      - name: Headers must be usable from C++
        run: |
          cat > /tmp/cpp_check.cpp <<'EOF'
          #include "synth/synth.h"
          int main() {
              synth_t s;
              float block[64];
              synth_init(&s, 48000.0f);
              synth_note_on(&s, 60, 1.0f);
              synth_render(&s, block, 64);
              return 0;
          }
          EOF
          g++ -std=c++17 -Wall -Wextra -Werror -Ilibsynth/include \
              /tmp/cpp_check.cpp build/libsynth.a -o /tmp/cpp_check
          /tmp/cpp_check

      - name: Cross-compiles for bare metal ARM
        # The target the portability claims are about. It catches things a
        # desktop build cannot: the ARM EABI stores enums in the smallest type
        # that fits, so range checks written for a 32-bit enum warn here, and a
        # core with no FPU turns every float operation into a libgcc call.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi
          for target in "-mcpu=cortex-m0plus -mthumb" \
                        "-mcpu=cortex-m4 -mthumb -mfloat-abi=hard -mfpu=fpv4-sp-d16"; do
            echo "=== $target ==="
            rm -rf arm-build && mkdir arm-build
            for unit in dsp synth midi delay; do
              arm-none-eabi-gcc $target -Os -std=c11 \
                -Wall -Wextra -Wpedantic -Wconversion -Werror \
                -Ilibsynth/include -c libsynth/src/$unit.c -o arm-build/$unit.o
            done
            arm-none-eabi-gcc $target -Os -std=c11 \
              -Wall -Wextra -Wpedantic -Wconversion -Werror \
              -Ilibsynth/include -c libsynth/backends/embedded/rp2040_example.c \
              -o arm-build/example.o
            arm-none-eabi-ar rcs arm-build/libsynth.a arm-build/*.o
            sh libsynth/tools/check-no-external-deps.sh arm-build/libsynth.a arm-none-eabi-nm
            arm-none-eabi-size -t arm-build/libsynth.a | tail -1
          done

      - name: Builds with parameter names compiled out
        # The flash-saving path for small targets, easy to break unnoticed.
        run: |
          cmake -S libsynth -B build-noname \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-DSYNTH_PARAM_NAMES=0 -Werror"
          cmake --build build-noname
          cd build-noname && ctest --output-on-failure
